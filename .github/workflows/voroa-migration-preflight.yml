name: Voroa Migration Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Read-only Voroa connection and schema check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Voroa connection (read-only)
        env:
          MILAN_DATABASE_URL: ${{ secrets.MILAN_DATABASE_URL || secrets.VOROA_DATABASE_URL }}
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          (async () => {
            const connectionString = process.env.MILAN_DATABASE_URL;
            if (!connectionString) {
              console.error('Missing GitHub Actions secret: MILAN_DATABASE_URL');
              process.exitCode = 1;
              return;
            }

            const client = new Client({
              connectionString,
              connectionTimeoutMillis: 10000,
              ssl: { rejectUnauthorized: false },
            });

            try {
              await client.connect();
              const identity = await client.query(
                'SELECT current_database() AS database, current_user AS role, pg_size_pretty(pg_database_size(current_database())) AS database_size'
              );
              const required = await client.query(
                "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name = ANY($1::text[]) ORDER BY table_name",
                [['users', 'dwn_storage', 'webauthn_credentials', 'milan_database_snapshots',
                  'payment_orders', 'storage_upgrade_requests',
                  'milan_legacy_payment_orders', 'milan_legacy_storage_upgrade_requests']]
              );
              const found = new Set(required.rows.map(row => row.table_name));
              const requiredForPreflight = ['users', 'dwn_storage', 'milan_database_snapshots'];
              const missing = requiredForPreflight.filter(name => !found.has(name));

              // Read-only counts only; never print user or payment records.
              for (const table of [
                'users', 'dwn_storage', 'webauthn_credentials',
                'milan_database_snapshots', 'payment_orders',
                'storage_upgrade_requests', 'milan_legacy_payment_orders',
                'milan_legacy_storage_upgrade_requests'
              ]) {
                if (!found.has(table)) {
                  console.log(`Row count ${table}: TABLE_NOT_VISIBLE`);
                  continue;
                }
                const count = await client.query(
                  `SELECT COUNT(*)::text AS row_count FROM public.${table}`
                );
                console.log(`Row count ${table}: ${count.rows[0].row_count}`);
              }

              // Report snapshot metadata only; never log snapshot payloads.
              if (found.has('milan_database_snapshots')) {
                const snapshots = await client.query(`
                  SELECT s.name, s.pushed_at,
                    jsonb_typeof(s.data) AS payload_type,
                    CASE WHEN jsonb_typeof(s.data) = 'object'
                      THEN (SELECT COUNT(*)::int FROM jsonb_object_keys(s.data))
                    END AS top_level_keys,
                    CASE WHEN jsonb_typeof(s.data) = 'array'
                      THEN jsonb_array_length(s.data)
                    END AS array_items
                  FROM public.milan_database_snapshots s
                  ORDER BY s.name
                  LIMIT 100
                `);
                for (const row of snapshots.rows) {
                  console.log('Snapshot metadata:', JSON.stringify({
                    name: row.name,
                    pushedAt: row.pushed_at,
                    payloadType: row.payload_type,
                    topLevelKeys: row.top_level_keys,
                    arrayItems: row.array_items
                  }));
                }
              }

              // Read-only inventory: discover existing public tables without reading their data.
              const inventory = await client.query(
                "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE' ORDER BY table_name LIMIT 250"
              );
              console.log('Public table inventory:', inventory.rows.map(row => row.table_name).join(', '));

              console.log('Voroa connection: OK');
              console.log('Database:', identity.rows[0].database);
              console.log('Connected role:', identity.rows[0].role);
              console.log('Database size:', identity.rows[0].database_size);
              console.log('Found expected tables:', [...found].join(', ') || '(none)');

              if (missing.length) {
                console.error('Missing required tables:', missing.join(', '));
                process.exitCode = 1;
              } else {
                console.log('Read-only preflight: PASS');
              }
            } catch (error) {
              console.error('Voroa preflight failed:', error.message);
              process.exitCode = 1;
            } finally {
              await client.end().catch(() => {});
            }
          })();
          NODE
