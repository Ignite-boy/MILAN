name: MILAN • Build & Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milan-live-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-source:
    name: "Source event received"
    runs-on: ubuntu-latest
    steps:
      - name: Live source signal
        run: |
          echo "Workflow event received"
          echo "Commit: $GITHUB_SHA"
          echo "Author: $GITHUB_ACTOR"
          {
            echo "## Source event received"
            echo ""
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Actor: `$GITHUB_ACTOR`"
            echo "- Ref: `$GITHUB_REF`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: "PASS • Build verification"
    runs-on: ubuntu-latest
    needs: live-source
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Run project build check
        run: npm run build

      - name: Verify avatar persistence across refresh
        run: npm run test:avatar-persistence

      - name: Verify video byte-range semantics
        run: npm run test:video-range

      - name: Verify video scroll playback lifecycle
        run: npm run test:video-scroll

      - name: Verify resumable media upload behavior
        # The upload self-tests mock storage; this placeholder satisfies import-time DB URL validation only.
        env:
          MILAN_DATABASE_URL: postgres://milan-test:milan-test@127.0.0.1:1/milan_test
        run: npm run test:upload

      - name: Verify payment idempotency and quota invariants
        run: npm run test:payment-idempotency
      - name: Exercise payment ownership and idempotent transitions
        run: npm run test:payment-idempotency-runtime
      - name: Verify Cashfree provider security and API contracts
        run: npm run test:cashfree-gateway
      - name: Exercise Cashfree checkout, reconciliation and webhooks
        run: npm run test:cashfree-route

      - name: Verify chat architecture
        run: npm run test:chat

      - name: Verify WebAuthn PostgreSQL contracts
        run: npm run test:webauthn
      - name: Verify feed pagination contract
        run: npm run test:feed-pagination

      - name: Verify API rate-limit behavior
        run: npm run test:security

      - name: Verify MILAN Pay frontend and Cashfree checkout contract
        run: npm run test:milan-pay

      - name: Verify MILAN Pay architecture
        run: npm run test:payment

      - name: Verify persistence failure visibility
        run: npm run test:persistence-visibility

      - name: Verify AI analytics data boundaries
        run: npm run test:ai-boundary

      - name: Verify authoritative session revocation
        run: npm run test:session-token

      - name: Verify shared media limit contract
        run: npm run test:media-limits

      - name: Verify readiness semantics
        run: npm run test:readiness

      - name: Verify critical frontend files
        run: |
          test -s frontend/app.html
          test -s frontend/index.html
          test -s frontend/chat/index.html
          test -s frontend/milan-core.css
          test -s frontend/milan-login-pro.css
          echo "✅ Critical MILAN frontend files present"

      - name: Set up Python for identity-security tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests

      - name: Test Travel Agent identity boundary
        working-directory: Travel-Agent
        run: python -m pytest -q tests/test_auth.py

      - name: PASS summary
        run: |
          echo "✅ PASS — Build verification completed"
          {
            echo "## ✅ PASS — Build verification"
            echo ""
            echo "Build and critical frontend file checks completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy MILAN to Google Cloud Run
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v7

      - name: Check guarded GCP release configuration
        env:
          GCP_DEPLOY_ENABLED: ${{ vars.GCP_DEPLOY_ENABLED }}
          GCP_DATABASE_READY: ${{ vars.GCP_DATABASE_READY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_CLOUD_SQL_CONNECTION_NAME: ${{ vars.GCP_CLOUD_SQL_CONNECTION_NAME }}
        run: |
          set -euo pipefail
          [[ "$GCP_DEPLOY_ENABLED" == "true" ]] || { echo "::error::GCP_DEPLOY_ENABLED must be true for a main-branch release."; exit 1; }
          [[ "$GCP_DATABASE_READY" == "true" ]] || { echo "::error::GCP_DATABASE_READY must be true before deployment."; exit 1; }
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT GCP_REGION GCP_CLOUD_RUN_SERVICE GCP_CLOUD_SQL_CONNECTION_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Deploy MILAN to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          source: ./
          secrets: |
            MILAN_DATABASE_URL=MILAN_DATABASE_URL:latest
          flags: >-
            --allow-unauthenticated
            --add-cloudsql-instances=${{ vars.GCP_CLOUD_SQL_CONNECTION_NAME }}

  production:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    name: "LIVE • Post-deploy production smoke"
    runs-on: ubuntu-latest
    needs: [verify, deploy]
    steps:
      - name: Wait for production propagation
        run: |
          echo "⏳ Waiting for the production deployment to propagate..."
          sleep 25

      - name: Production smoke check
        run: |
          set -e
          for attempt in $(seq 1 12); do
            echo "Production check $attempt/12"
            if curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/ \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/chat/ \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/robots.txt \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/sitemap.xml \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/sitemap-index.xml \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/llms.txt \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/keywords.json \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/ai-info \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/ai-info.json \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/sitemap_index.xml \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/keywords \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/topics; then
              health_payload="$(curl -fsSL --max-time 15 https://milanlife.in/api/health)"
              printf '%s' "$health_payload" | node -e 'let raw="";process.stdin.on("data",c=>raw+=c);process.stdin.on("end",()=>{try{const p=JSON.parse(raw);if(p.healthSemantics?.level!=="liveness"||typeof p.healthSemantics?.realDwnProtocol!=="boolean")process.exit(1)}catch(_){process.exit(1)}})'
              pay_payload="$(curl -fsSL --max-time 15 https://milanlife.in/api/milan-pay/config)"
              printf '%s' "$pay_payload" | node -e 'let raw="";process.stdin.on("data",c=>raw+=c);process.stdin.on("end",()=>{try{const p=JSON.parse(raw);if(p.ok!==true||p.verificationMode!=="manual-bank-verification"||p.automaticPaymentConfirmationAvailable!==false||typeof p.merchantVerificationStatus!=="string"||typeof p.upiAvailable!=="boolean"||typeof p.googlePayIosAvailable!=="boolean")process.exit(1)}catch(_){process.exit(1)}})'
              echo "🟢 LIVE — public UI, health semantics and MILAN Pay status contract are reachable"
              {
                echo "## 🟢 LIVE — Production"
                echo ""
                echo "Production smoke checks passed:"
                echo "- / and /chat/"
                echo "- /robots.txt, /sitemap.xml, /sitemap-index.xml"
                echo "- /llms.txt, /keywords.json, /ai-info and aliases"
                echo "- /api/health reports liveness separately from DWN protocol readiness"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Production smoke check failed"
          exit 1
