name: MILAN • Build & Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milan-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-source:
    name: "LIVE • Main branch"
    runs-on: ubuntu-latest
    steps:
      - name: Live source signal
        run: |
          echo "🟢 LIVE — main branch update received"
          echo "Commit: $GITHUB_SHA"
          echo "Author: $GITHUB_ACTOR"
          {
            echo "## 🟢 LIVE — Main branch"
            echo ""
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Actor: `$GITHUB_ACTOR`"
            echo "- Branch: `main`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: "PASS • Build verification"
    runs-on: ubuntu-latest
    needs: live-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project build check
        run: npm run build

      - name: Verify chat architecture
        run: npm run test:chat

      - name: Verify critical frontend files
        run: |
          test -s frontend/app.html
          test -s frontend/index.html
          test -s frontend/chat/index.html
          test -s frontend/milan-core.css
          test -s frontend/milan-login-pro.css
          echo "✅ Critical MILAN frontend files present"

      - name: Set up Python for identity-security tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests

      - name: Test Travel Agent identity boundary
        working-directory: Travel-Agent
        run: python -m pytest -q tests/test_auth.py

      - name: PASS summary
        run: |
          echo "✅ PASS — Build verification completed"
          {
            echo "## ✅ PASS — Build verification"
            echo ""
            echo "Build and critical frontend file checks completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.event_name != 'pull_request'
    name: "LIVE • Production smoke"
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Wait for Vercel propagation
        run: |
          echo "⏳ Waiting for the production deployment to propagate..."
          sleep 25

      - name: Production smoke check
        run: |
          set -e
          for attempt in $(seq 1 12); do
            echo "Production check $attempt/12"
            if curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/ \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/chat/ \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/robots.txt \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/sitemap.xml \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/sitemap-index.xml \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/llms.txt \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/keywords.json \
              && curl -fsSL --max-time 15 -o /dev/null https://milanlife.in/ai-info; then
              echo "🟢 LIVE — public UI and canonical SEO routes are reachable"
              {
                echo "## 🟢 LIVE — Production"
                echo ""
                echo "Production smoke checks passed:"
                echo "- / and /chat/"
                echo "- /robots.txt, /sitemap.xml, /sitemap-index.xml"
                echo "- /llms.txt, /keywords.json, /ai-info"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Production smoke check failed"
          exit 1
