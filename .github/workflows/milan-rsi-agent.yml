name: MILAN RSI Repair Agent

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional failed MILAN Sentinel run ID for a safe evidence-handoff replay"
        required: false
        type: string
  workflow_run:
    workflows: ["MILAN Sentinel"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: milan-rsi-repair
  cancel-in-progress: false

jobs:
  repair-analysis:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Sentinel
        run: npm ci
        working-directory: Milan-Sentinel
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: Milan-Sentinel
      - name: Install RSI agent
        run: npm install --no-audit --no-fund
        working-directory: Milan-RSI-Agent
      - name: Test RSI runtime and failure semantics
        run: npm test
        working-directory: Milan-RSI-Agent
      - name: Validate source Sentinel run
        id: source
        if: github.event_name == 'workflow_run' || inputs.source_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            source_id="$(python3 -c 'import json,os; print(json.load(open(os.environ["EVENT_PATH"]))["workflow_run"]["id"])')"
          else
            source_id="$DISPATCH_SOURCE_RUN_ID"
          fi
          case "$source_id" in
            ''|*[!0-9]*) echo "ERROR: source_run_id must be a numeric Actions run ID." >&2; exit 1 ;;
          esac

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_id" > /tmp/rsi-source-run.json
          workflow_id="$(python3 -c 'import json; print(json.load(open("/tmp/rsi-source-run.json"))["workflow_id"])')"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > /tmp/rsi-source-workflow.json

          python3 - <<'PY'
          import json, os, sys
          run = json.load(open("/tmp/rsi-source-run.json"))
          workflow = json.load(open("/tmp/rsi-source-workflow.json"))
          if run.get("head_branch") != "main":
              sys.exit("ERROR: source Sentinel run must target main.")
          if (run.get("head_repository") or {}).get("full_name", "").lower() != os.environ["GITHUB_REPOSITORY"].lower():
              sys.exit("ERROR: source run must belong to this repository, not a fork.")
          if run.get("conclusion") != "failure":
              sys.exit("ERROR: source Sentinel run must have failed.")
          if workflow.get("path") != ".github/workflows/milan-sentinel.yml" or workflow.get("name") != "MILAN Sentinel":
              sys.exit("ERROR: source_run_id is not from the canonical MILAN Sentinel workflow.")
          print(f"Validated failed Sentinel run {run['id']} ({run['html_url']}).")
          PY
          echo "source_run_id=$source_id" >> "$GITHUB_OUTPUT"
          echo "source_conclusion=failure" >> "$GITHUB_OUTPUT"

      - name: Download evidence from source Sentinel run
        if: steps.source.outputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: sentinel-*
          path: sentinel-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.source_run_id }}
      - name: Merge evidence from source Sentinel run
        if: steps.source.outputs.source_run_id != ''
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_CONCLUSION: ${{ steps.source.outputs.source_conclusion }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          artifact_root = Path("sentinel-artifacts")
          files = sorted(artifact_root.rglob("latest-results.json"))
          if not files:
              sys.exit("ERROR: No latest-results.json found in artifacts from the triggering run; refusing to use stale evidence.")

          results = []
          source_files = []
          theoretical_count = None
          for file in files:
              try:
                  payload = json.loads(file.read_text())
              except Exception as error:
                  sys.exit(f"ERROR: Invalid JSON in {file}: {error}")
              rows = payload.get("results") if isinstance(payload, dict) else None
              if not isinstance(rows, list):
                  continue
              results.extend(rows)
              source_files.append(str(file))
              if payload.get("matrixCaseCount") is not None:
                  theoretical_count = payload["matrixCaseCount"]

          if not source_files or not results:
              sys.exit("ERROR: Downloaded artifacts contain no valid result rows; refusing to use stale evidence.")

          counts = Counter(str(row.get("status", "UNKNOWN")) for row in results if isinstance(row, dict))
          output = Path("Milan-Sentinel/reports/latest-results.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          report = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "sourceRunId": os.environ["SOURCE_RUN_ID"],
              "sourceRunConclusion": os.environ["SOURCE_RUN_CONCLUSION"],
              "sourceArtifacts": source_files,
              "matrixCaseCount": theoretical_count,
              "execution": {"mode": "merged-triggering-run-evidence", "sourceArtifactCount": len(source_files), "resultCount": len(results)},
              "passed": counts.get("PASS", 0),
              "failed": counts.get("FAIL", 0),
              "skipped": counts.get("SKIP", 0),
              "results": results
          }
          output.write_text(json.dumps(report, indent=2) + "\n")
          print(f"Merged {len(source_files)} report file(s): {len(results)} result row(s).")
          print(f"Source run: {report['sourceRunId']} ({report['sourceRunConclusion']})")
          print(f"Status counts: PASS={report['passed']} FAIL={report['failed']} SKIP={report['skipped']}")
          print(f"Wrote {output}")
          PY
      - name: Analyze and propose one bounded repair cycle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
          RSI_AUTO_PUSH: 'false'
          RSI_MODEL: ${{ vars.RSI_MODEL }}
          RSI_TRIGGERED_BY_SENTINEL_FAILURE: ${{ steps.source.outputs.source_run_id != '' }}
        run: node scripts/rsi-loop.js
        working-directory: Milan-RSI-Agent
      - name: Upload Sentinel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milan-rsi-sentinel-evidence
          path: Milan-Sentinel/reports/latest-results.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload repair proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milan-rsi-repair-proposal
          path: Milan-RSI-Agent/evidence/
          if-no-files-found: ignore
          retention-days: 14
