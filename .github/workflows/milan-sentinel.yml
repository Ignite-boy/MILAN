name: MILAN Sentinel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Sentinel
        run: npm ci
        working-directory: Milan-Sentinel
      - name: Install Chromium for browser adapters
        run: npx playwright install --with-deps chromium
        working-directory: Milan-Sentinel
      - name: Validate theoretical 10M combinations
        run: npm run validate
        working-directory: Milan-Sentinel
      - name: Execute representative smoke checks against checkout
        env:
          MILAN_URL: http://127.0.0.1:4173
          MILAN_API_URL: https://milanlife.in
        run: |
          node scripts/serve-frontend.js > "$RUNNER_TEMP/milan-sentinel-smoke-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/milan-sentinel-smoke-server.log" || true
            exit 1
          fi

          npm run smoke
        working-directory: Milan-Sentinel
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-results
          path: Milan-Sentinel/reports/latest-results.json
          if-no-files-found: ignore

  shard:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Sentinel
        run: npm ci
        working-directory: Milan-Sentinel
      - name: Install Chromium for browser adapters
        run: npx playwright install --with-deps chromium
        working-directory: Milan-Sentinel
      - name: Execute supported test shard against checkout
        env:
          SHARD: ${{ matrix.shard }}
          MILAN_URL: http://127.0.0.1:4173
          MILAN_API_URL: https://milanlife.in
        run: |
          node scripts/serve-frontend.js > "$RUNNER_TEMP/milan-sentinel-shard-$SHARD-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/milan-sentinel-shard-$SHARD-server.log" || true
            exit 1
          fi

          node scripts/run-matrix.js --supported --shard="$SHARD" --shards=8
        working-directory: Milan-Sentinel
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-shard-${{ matrix.shard }}
          path: Milan-Sentinel/reports/latest-results.json
          if-no-files-found: ignore
