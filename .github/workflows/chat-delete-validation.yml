name: Chat Delete Validation

on:
  push:
    branches:
      - feature/chat-message-delete-20261026

permissions:
  contents: read

jobs:
  chat-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify project build
        run: npm run build
      - name: Verify chat architecture and deletion invariants
        run: npm run test:chat
      - name: Parse inline chat JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('frontend/chat/index.html', 'utf8');
          const re = /<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
          let match;
          let checked = 0;
          while ((match = re.exec(html))) {
            const tag = match[0].slice(0, match[0].indexOf('>'));
            if (/\bsrc\s*=/.test(tag)) continue;
            if (/\btype\s*=\s*["']application\/ld\+json["']/i.test(tag)) continue;
            if (!match[1].trim()) continue;
            const result = spawnSync(process.execPath, ['--check', '-'], {
              input: match[1],
              encoding: 'utf8'
            });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout || 'Inline script syntax check failed\n');
              process.exit(result.status || 1);
            }
            checked += 1;
          }
          if (!checked) throw new Error('No inline chat JavaScript blocks found.');
          console.log('Parsed ' + checked + ' inline JavaScript block(s) successfully.');
          NODE
