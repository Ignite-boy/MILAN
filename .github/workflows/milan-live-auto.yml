name: MILAN UI Deployment

run-name: "${{ inputs.run_name || format('MILAN UI Deployment #{0}', github.run_number) }}"

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: 'AI-generated UI improvement name'
        required: true
        type: string
      auto_branch:
        description: 'Verified UI branch'
        required: true
        type: string
      expected_commit_sha:
        description: 'Expected UI commit SHA'
        required: true
        type: string
      build_id:
        description: 'Planner build marker'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: milan-live-auto
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout MILAN workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare MILAN workspace
        run: |
          git clone "https://github.com/Ignite-boy/MILAN.git" milan
          cd milan
          git config user.name "MILAN Live UI Bot"
          git config user.email "bot@milanlife.in"

      - name: Validate verified UI commit
        working-directory: milan
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
          AUTO_BRANCH: ${{ inputs.auto_branch }}
        run: |
          git fetch origin main "$AUTO_BRANCH"
          BRANCH_SHA="$(git rev-parse "origin/$AUTO_BRANCH")"
          echo "EXPECTED SHA: $EXPECTED_SHA"
          echo "BRANCH SHA:   $BRANCH_SHA"
          test "$BRANCH_SHA" = "$EXPECTED_SHA"

          changed="$(git diff --name-only origin/main..."$BRANCH_SHA")"
          if [ -z "$changed" ]; then
            echo "No changes on verified branch"
            exit 1
          fi

          bad="$(printf '%s\n' "$changed" | grep -Ev '^frontend/.*\.(html|css|js)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unsafe files changed:"
            echo "$bad"
            exit 1
          fi

      - name: Create verification PR
        env:
          GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
          AUTO_BRANCH: ${{ inputs.auto_branch }}
          RUN_NAME: ${{ inputs.run_name }}
        run: |
          COMMIT_NAME="feat(ui): $RUN_NAME"
          gh pr create \
            --repo Ignite-boy/MILAN \
            --base main \
            --head "$AUTO_BRANCH" \
            --title "$COMMIT_NAME" \
            --body "Automated UI change generated by MILAN UI Planner."

      - name: Verify PR branch
        working-directory: milan
        env:
          AUTO_BRANCH: ${{ inputs.auto_branch }}
        run: |
          git fetch origin main "$AUTO_BRANCH"
          git diff --check origin/main..."origin/$AUTO_BRANCH"

          changed_js="$(git diff --name-only origin/main..."origin/$AUTO_BRANCH" -- '*.js')"
          if [ -n "$changed_js" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && node --check "$file"
            done <<< "$changed_js"
          fi

      - name: Wait for required CI checks
        working-directory: milan
        env:
          GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
          AUTO_BRANCH: ${{ inputs.auto_branch }}
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(gh pr list \
            --repo Ignite-boy/MILAN \
            --head "$AUTO_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')"

          test -n "$PR_NUMBER"

          echo "Waiting for CI checks on PR #$PR_NUMBER"
          gh pr checks "$PR_NUMBER" \
            --repo Ignite-boy/MILAN \
            --watch \
            --interval 10

          META="$(gh pr view "$PR_NUMBER" \
            --repo Ignite-boy/MILAN \
            --json state,headRefOid,baseRefName,isDraft \
            --jq '[.state, .headRefOid, .baseRefName, (.isDraft | tostring)] | @tsv')"

          IFS=$'\t' read -r PR_STATE PR_SHA PR_BASE PR_DRAFT <<< "$META"

          test "$PR_STATE" = "OPEN"
          test "$PR_SHA" = "$EXPECTED_SHA"
          test "$PR_BASE" = "main"
          test "$PR_DRAFT" = "false"

          CHECKS_JSON="$(gh api \
            "repos/Ignite-boy/MILAN/commits/$PR_SHA/check-runs?per_page=100")"

          for REQUIRED in \
            "PASS • Build verification" \
            "validate-and-smoke" \
            "android-build"; do

            RESULT="$(printf '%s' "$CHECKS_JSON" | jq -r \
              --arg name "$REQUIRED" \
              '[.check_runs[] | select(.name == $name)]
               | sort_by(.started_at // .created_at // "")
               | last
               | (.conclusion // "pending")')"

            if [ "$RESULT" != "success" ]; then
              echo "Required check did not pass: $REQUIRED ($RESULT)"
              exit 1
            fi

            echo "PASS: $REQUIRED"
          done

      - name: Merge verified PR
        working-directory: milan
        env:
          GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
          AUTO_BRANCH: ${{ inputs.auto_branch }}
          RUN_NAME: ${{ inputs.run_name }}
        run: |
          COMMIT_NAME="feat(ui): $RUN_NAME"
          PR_NUMBER="$(gh pr list --repo Ignite-boy/MILAN --head "$AUTO_BRANCH" --base main --state open --json number --jq '.[0].number')"
          test -n "$PR_NUMBER"

          gh pr merge "$PR_NUMBER" --repo Ignite-boy/MILAN --squash --delete-branch

          git fetch origin main
          MERGED_COMMIT_NAME="$(git log origin/main -1 --pretty=%s)"
          echo "EXPECTED COMMIT NAME: $COMMIT_NAME"
          echo "MERGED COMMIT NAME:   $MERGED_COMMIT_NAME"
          test "$MERGED_COMMIT_NAME" = "$COMMIT_NAME"

      - name: Verify production deployment
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          for i in $(seq 1 30); do
            code="$(curl -L -s -o /tmp/milan-home -w '%{http_code}' --max-time 20 "https://milanlife.in/?_milan_run=${BUILD_ID}")"
            marker="$(curl -L -s --max-time 20 "https://milanlife.in/milan-build.txt?_milan_run=${BUILD_ID}" || true)"
            echo "Deploy check $i/30: HTTP=$code MARKER=$marker"
            if [ "$code" = "200" ] && [ "$marker" = "$BUILD_ID" ]; then
              echo "DEPLOYMENT SUCCESSFUL"
              exit 0
            fi
            sleep 20
          done
          exit 1
