name: Web4 AI Layer Validation

on:
  push:
    branches:
      - "ai/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web4-ai-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Python GRU and integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web4-ai/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install AI service dependencies
        run: python -m pip install --disable-pip-version-check -r web4-ai/requirements.txt

      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/services/markovStream.js
          node --check frontend/assets/js/milan-predictive-layer.js

      - name: Check Python syntax
        run: |
          python -m py_compile web4-ai/model.py web4-ai/app.py web4-ai/train.py web4-ai/smoke_test.py

      - name: Run isolated AI service smoke test
        run: |
          SMOKE_ROOT="$(mktemp -d)"
          MILAN_WEB4_AI_SECRET="smoke-only-secret-do-not-use-in-production" \
          MILAN_WEB4_DATA_DIR="$SMOKE_ROOT/data" \
          MILAN_WEB4_MODEL_PATH="$SMOKE_ROOT/model.pt" \
            python web4-ai/smoke_test.py

      - name: Check GRU forward pass
        run: |
          PYTHONPATH=web4-ai python - <<'PY'
          import torch
          from model import NextItemGRU
          model = NextItemGRU(vocab_size=12)
          inputs = torch.tensor([[2, 3, 4], [5, 6, 0]], dtype=torch.long)
          lengths = torch.tensor([3, 2], dtype=torch.long)
          logits = model(inputs, lengths)
          assert tuple(logits.shape) == (2, 12), tuple(logits.shape)
          print("PASS: GRU forward pass.")
          PY
