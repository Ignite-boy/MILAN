name: MILAN Android Build

on:
  push:
    branches: ['main', 'feat/android-apk-playstore-ready']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Build debug APK and release AAB
        run: gradle --no-daemon assembleDebug bundleRelease

      - name: Verify artifacts
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v5
        with:
          name: milan-android-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
