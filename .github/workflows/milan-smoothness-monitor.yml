name: MILAN Smoothness Monitor

run-name: "Smoothness pulse #${{ github.run_number }}"

on:
  schedule:
    # Every 15 minutes, offset from the top of the hour to avoid peak scheduling delays.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/milan-smoothness-monitor.yml

permissions:
  contents: read

concurrency:
  group: milan-smoothness-monitor
  cancel-in-progress: true

jobs:
  health-and-latency:
    name: "Measure Voroa health and response latency"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production health endpoints and publish targets
        shell: bash
        env:
          BASE_URL: https://milan-web.getvoroa.com
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/milan-smoothness"

          probe() {
            local name="$1"
            local route="$2"
            local body="$RUNNER_TEMP/milan-smoothness/$name.json"
            local http="000"
            local seconds="n/a"
            local valid="false"
            local attempt=1
            local meta=""

            for attempt in 1 2 3; do
              if meta="$(curl -sS -L --connect-timeout 5 --max-time 20 \
                -o "$body" -w '%{http_code}|%{time_total}' \
                "$BASE_URL$route" 2>/dev/null)"; then
                http="${meta%%|*}"
                seconds="${meta#*|}"
                if [[ "$http" == "200" ]] && python3 - "$body" "$name" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], "r", encoding="utf-8") as f:
                  payload = json.load(f)
          except Exception:
              raise SystemExit(1)
          if payload.get("ok") is not True:
              raise SystemExit(1)
          if sys.argv[2] == "api" and payload.get("storageOperational") is False:
              raise SystemExit(1)
          PY
                then
                  valid="true"
                  break
                fi
              else
                http="000"
                seconds="timeout"
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep 3; fi
            done

            printf '%s|%s|%s|%s\n' "$http" "$seconds" "$valid" "$attempt"
          }

          IFS='|' read -r HEALTH_HTTP HEALTH_SECONDS HEALTH_OK HEALTH_ATTEMPTS \
            <<< "$(probe health /health)"
          IFS='|' read -r API_HTTP API_SECONDS API_OK API_ATTEMPTS \
            <<< "$(probe api /api/health)"

          latency_status() {
            local value="$1"
            if [[ "$value" == "n/a" || "$value" == "timeout" ]]; then
              echo "N/A"
              return
            fi
            python3 - "$value" <<'PY'
          import sys
          try:
              seconds = float(sys.argv[1])
          except Exception:
              print("N/A")
              raise SystemExit
          print("PASS" if seconds <= 1.5 else "WARN")
          PY
          }

          HEALTH_LATENCY_TARGET="$(latency_status "$HEALTH_SECONDS")"
          API_LATENCY_TARGET="$(latency_status "$API_SECONDS")"
          {
            echo "# MILAN Smoothness Monitor"
            echo
            echo "- **Schedule:** every 15 minutes (UTC)"
            echo "- **Run:** #${GITHUB_RUN_NUMBER}"
            echo "- **Commit:** `$GITHUB_SHA`"
            echo "- **Latency target:** each successful health response in **≤ 1.5 seconds**"
            echo "- **Availability target:** HTTP 200 with a valid JSON `ok: true` response"
            echo
            echo "| Check | HTTP | Response time | Latency target | JSON/health | Attempts |"
            echo "|---|---:|---:|---|---|---:|"
            echo "| `/health` | $HEALTH_HTTP | ${HEALTH_SECONDS}s | $HEALTH_LATENCY_TARGET | $HEALTH_OK | $HEALTH_ATTEMPTS/3 |"
            echo "| `/api/health` | $API_HTTP | ${API_SECONDS}s | $API_LATENCY_TARGET | $API_OK | $API_ATTEMPTS/3 |"
            echo
            echo "## What this measurement means"
            echo "- This run checks public service health and request latency. It does **not** claim to measure authenticated video playback, buffering, or browser scroll frame drops."
            echo "- Latency over target is reported as a warning; unhealthy endpoints fail the run so the failure remains visible in Actions."
            echo "- This workflow is read-only: it does not change application files, deploy code, or access/mutate the production database."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "health_http=$HEALTH_HTTP"
          echo "health_seconds=$HEALTH_SECONDS"
          echo "health_ok=$HEALTH_OK"
          echo "api_http=$API_HTTP"
          echo "api_seconds=$API_SECONDS"
          echo "api_ok=$API_OK"

          if [[ "$HEALTH_OK" != "true" || "$API_OK" != "true" ]]; then
            echo "::error::MILAN health target failed. See the step summary for endpoint results."
            exit 1
          fi
