name: Deep SEO Agent

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public site URL to audit"
        required: false
        default: "https://milanlife.in/"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  seo-audit:
    name: Audit public SEO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit live site
        env:
          SEO_TARGET_URL: ${{ inputs.target_url || 'https://milanlife.in/' }}
          SEO_MAX_PAGES: "100"
          SEO_TIMEOUT: "20"
        run: |
          python -m py_compile Live-UI-Update/seo-agent/seo_agent.py
          rm -rf seo-reports
          set +e
          python Live-UI-Update/seo-agent/seo_agent.py
          audit_status=$?
          set -e
          if [ ! -s seo-reports/latest.json ]; then
            echo "::error::SEO audit did not produce a report; this is an execution failure."
            exit 2
          fi
          if [ "$audit_status" -eq 0 ]; then
            echo "SEO audit completed with no blocking issues."
          elif [ "$audit_status" -eq 1 ]; then
            echo "::warning::SEO issues were detected. The audit report was generated; review the artifact."
          else
            echo "::error::SEO auditor exited unexpectedly with code $audit_status."
            exit "$audit_status"
          fi

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milan-seo-report
          path: seo-reports/latest.json
          if-no-files-found: warn
          retention-days: 14
