<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline — MILAN</title>
<meta name="theme-color" content="#050e2b">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eaeefb;
    background:radial-gradient(1100px 600px at 80% -10%,rgba(217,70,239,.14),transparent 58%),
      radial-gradient(900px 500px at 0 0,rgba(245,158,11,.09),transparent 55%),#070d1f;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:24px env(safe-area-inset-right) 24px env(safe-area-inset-left)}
  .box{max-width:420px}
  .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 22px;display:block}
  h1{font-size:1.6rem;margin-bottom:10px;
    background:linear-gradient(135deg,#fbbf24,#f59e0b 35%,#e879f9 80%,#d946ef);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#c3cce4;line-height:1.65;margin-bottom:22px}
  button{font:inherit;font-weight:800;cursor:pointer;border:0;
    background:linear-gradient(135deg,#f59e0b,#fbbf24 50%,#d946ef);color:#0a0f22;
    padding:14px 30px;border-radius:14px;min-height:48px;width:100%;max-width:260px}
  button:active{filter:brightness(.95)}
  small{display:block;margin-top:18px;color:#8ba4d4}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/assets/milan-logo-circle.png" alt="MILAN">
    <h1>You're offline</h1>
    <p>MILAN needs an internet connection to load your decentralized space. Check your connection and try again — your data is safe in your own node.</p>
    <button onclick="location.reload()">Retry</button>
    <small>MILAN — decentralized, privacy-first social media.</small>
  </div>
<script>
  // Auto-retry the moment connectivity returns.
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
