<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>MILAN Launch Center – Get Started with Decentralized Social</title><style>body{font-family:Inter,Segoe UI,Arial,sans-serif;background:#0b1020;color:#eef3ff;margin:0}.wrap{max-width:1050px;margin:auto;padding:30px}.card{background:#141b34;border:1px solid #263256;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 16px 50px #0004}.ok{color:#62e6a3}.bad{color:#f77}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.pill{padding:8px 11px;border-radius:999px;background:#23305a;display:inline-block;margin:4px}button{background:#556dff;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700}a{color:#89a6ff}</style>  <link rel="icon" href="/assets/milan-logo-circle.png" sizes="any" />

</head><body><div class="wrap"><h1>🚀 MILAN Launch Center</h1><p>Target launch: <b>4 September 2026</b>. Model: <b>One User = One Isolated DWN Space</b>.</p><div id="status" class="card">Loading readiness...</div><div class="grid" id="phases"></div><div class="card"><h2>Quick links</h2><p><a href="/">Open Milan App</a> · <a href="/api/health">API Health</a> · <a href="/api/launch/readiness">Launch Readiness JSON</a> · <a href="/api/security/policy">Security Policy</a></p></div></div><script>async function j(u){return(await fetch(u)).json()}(async()=>{const ready=await j("/api/launch/readiness");document.getElementById("status").innerHTML=`<h2>${ready.ok?"✅ Ready foundation":"⚠️ Check required"}</h2><p>Score: ${ready.score}/${ready.total}</p><div>${Object.entries(ready.checks).map(([k,v])=>`<span class="pill ${v?"ok":"bad"}">${v?"✓":"✕"} ${k}</span>`).join("")}</div>`;const roadmap=await j("/api/launch/roadmap");document.getElementById("phases").innerHTML=roadmap.phases.map(p=>`<div class="card"><h3>Phase ${p.phase}: ${p.name}</h3><p class="ok">${p.status}</p><ul>${p.proof.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")})().catch(e=>document.getElementById("status").innerHTML='<span class="bad">'+e.message+"</span>");</script><script src="/milan-core.js?v=20260627" defer></script>
