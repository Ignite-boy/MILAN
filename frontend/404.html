<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Not Found (404) — MILAN</title>
<meta name="robots" content="noindex,follow,max-image-preview:large">
<link rel="icon" href="/assets/milan-logo-circle.png" sizes="any">
<style>
*{box-sizing:border-box;margin:0;padding:0}
a.btn{transition:transform .15s ease}
a.btn:hover{transform:translateY(-1px)}
a.btn:active{transform:translateY(0) scale(.98)}
a.link:active{opacity:.75}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eaeefb;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:radial-gradient(1100px 600px at 80% -10%,rgba(217,70,239,.12),transparent 58%),radial-gradient(900px 500px at 0 0,rgba(245,158,11,.08),transparent 55%),#070d1f;text-align:center;padding:24px}
h1{font-size:5rem;font-weight:800;background:linear-gradient(135deg,#fbbf24,#f59e0b 30%,#e879f9 75%,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#c3cce4;margin:14px 0 22px;font-size:1.05rem}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;background:linear-gradient(135deg,#f59e0b,#fbbf24 50%,#d946ef);color:#0a0f22;font-weight:800;padding:12px 24px;border-radius:14px;text-decoration:none;margin:6px}
a.link{color:#fbbf24;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;margin:0 10px}

a.btn:focus-visible,
a.link:focus-visible{outline:3px solid #fbbf24;outline-offset:3px}
main{max-width:34rem}

@media (prefers-reduced-motion: reduce){
  a.btn{transition:none}
  a.btn:hover{transform:none}
  a.btn:active{transform:none}
}
@media(max-width:380px){
  h1{font-size:3.5rem}
  main{max-width:30rem}
}

</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Yeh page nahi mila — the page you're looking for doesn't exist or has moved.</p>
  <a class="btn" href="/">Go to MILAN Home →</a>

    <a class="link" href="/app">Open App</a> ·
    <a class="link" href="/about">About</a> ·
    <a class="link" href="/decentralized-social-media">What is Decentralized Social Media?</a> ·

  </p>
</main>

</html>
