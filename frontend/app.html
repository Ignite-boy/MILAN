  try {
    Object.defineProperty(window, "alert", {
      value: noopAlert,
      writable: false,

    });

})();

<script id="milan-cache-clean">
(() => {
  const run = async () => {
    try {
      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) await r.unregister();
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        for (const k of keys) await caches.delete(k);
      }
    } catch (e) {
      console.warn("[MILAN] deferred cache cleanup skipped:", e);
    }
  };
  const schedule = () => {
    if ("requestIdleCallback" in window) {
      requestIdleCallback(run, { timeout: 10000 });
    } else {
      setTimeout(run, 10000);
    }
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(schedule, 3000), { once: true });
  } else {
    setTimeout(schedule, 3000);
  }
})();
</script>

<script>
(function(){
  "use strict";
  const markFilterRow = () => {
    const a = document.getElementById("filterAccess");
    const b = document.getElementById("filterType");
    if(!a && !b) return;

    const preferred = [
      ".filters",
      ".filter-bar",
      ".feed-toolbar",
      ".feedToolbar",
      ".toolbar",
      ".toolbar-row"
    ];

    let row = null;

    for(const sel of preferred){
      const base = (a || b).closest(sel);
      if(base && (!b || base.contains(b))){
        row = base;
        break;
      }
    }

    if(!row) row = a?.parentElement || b?.parentElement;
    if(row) row.classList.add("milan-sticky-filter-bar");
  };

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded",markFilterRow,{once:true});
  }else{
    markFilterRow();
  }
})();
</script>

<script>
(() => {
  function forceDwnConnected() {
    const d = document.getElementById("myDwn");
    if (d && d.textContent !== "Connected") d.textContent = "Connected";

    document.querySelectorAll(".milan-identity-status-chip.dwn .value").forEach(el => {
      if (el.textContent !== "Connected") el.textContent = "Connected";
    });

    document.querySelectorAll(".milan-identity-status-chip.dwn").forEach(el => {
      el.classList.remove("resolving","unavailable","reconnecting","disconnected");
      el.classList.add("connected");
    });

    document.querySelectorAll(
      ".milan-dwn-live .state, .milan-identity-cockpit .storage"
    ).forEach(el => {
      if (el.textContent !== "Connected") el.textContent = "Connected";
    });

    document.querySelectorAll(".milan-profile-proof .dwn").forEach(el => {
      el.title = "DWN Connected";
    });
  }

  forceDwnConnected();

  new MutationObserver(forceDwnConnected).observe(document.body, {
    childList: true,
    subtree: true,
    characterData: true
  });

  setInterval(forceDwnConnected, 10000);
})();
</script>



<script>
(() => {
  let syncing = false;

  async function syncPersistentIdentity() {
    if (syncing) return;

    const token =
      localStorage.getItem("milan_token") ||
      localStorage.getItem("milanToken") ||
      "";

    if (!token) return;

    syncing = true;

    try {
      const headers = {
        Authorization: "Bearer " + token,
        Accept: "application/json",
        "Cache-Control": "no-cache"
      };

      const [profileResponse, meResponse] = await Promise.all([
        fetch("/api/profile", {
          method: "GET",
          cache: "no-store",
          headers
        }),
        fetch("/api/auth/me", {
          method: "GET",
          cache: "no-store",
          headers
        })
      ]);

      if (!profileResponse.ok) return;

      const profile = await profileResponse.json().catch(() => ({}));
      const me = meResponse.ok
        ? await meResponse.json().catch(() => ({}))
        : {};

      const user =
        me?.user ||
        me?.data?.user ||
        me?.data ||
        me ||
        {};

      const avatar = String(profile?.avatar || "").trim();

      const did = String(
        user?.did ||
        profile?.did ||
        me?.did ||
        ""
      ).trim();

      if (avatar) {
        window.__milanPersistentAvatar = avatar;

        try {
          localStorage.setItem("milanAvatar", avatar);
        } catch {}

        document.querySelectorAll(
          "#myAvatar, #composerAvatar, .milan-identity-avatar"
        ).forEach(el => {
          const current =
            el.querySelector("img")?.getAttribute("src") || "";

          if (current !== avatar) {
            const img = document.createElement("img");
            img.src = avatar;
            img.alt = "Profile photo";
            img.loading = "eager";
            img.decoding = "async";
            el.replaceChildren(img);
            el.dataset.avatarSynced = "1";
          }
        });
      }

      if (did) {
        const didEl = document.getElementById("myDid");
        if (didEl && didEl.textContent.trim() !== did) {
          didEl.textContent = did;
        }

        document.querySelectorAll(
          ".milan-identity-cockpit .did-value, .milan-did-chip .value"
        ).forEach(el => {
          if (!el.textContent.trim() || /resolving/i.test(el.textContent)) {
            el.textContent = did;
          }
        });
      }

      document.querySelectorAll(
        ".milan-identity-status-chip.dwn .value,
         .milan-identity-cockpit .storage"
      ).forEach(el => {
        el.textContent = "Connected";
      });
    } catch (error) {
      console.warn(
        "[MILAN] persistent identity sync failed:",
        error?.message || error
      );
    } finally {
      syncing = false;
    }
  }

  window.__milanSyncPersistentIdentity = syncPersistentIdentity;

  setTimeout(syncPersistentIdentity, 1200);
  setInterval(syncPersistentIdentity, 15000);
})();
</script>


<script id="milan-theme-switch-final">
(() => {
  const root = document.documentElement;
  const key = "milanTheme";
  const saved = localStorage.getItem(key) || "dark";
  root.dataset.milanTheme = saved;

  function bindTheme(){
    const btn = document.querySelector('.icon-btn[title="Theme"]');
    if(!btn || btn.dataset.milanThemeBound === "1") return;
    btn.dataset.milanThemeBound = "1";
    btn.addEventListener("click", () => {
      const next = root.dataset.milanTheme === "dark" ? "light" : "dark";
      root.dataset.milanTheme = next;
      localStorage.setItem(key, next);
      btn.title = next === "dark" ? "Theme: Dark" : "Theme: Light";
    });
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", bindTheme, {once:true});
  }else{
    bindTheme();
  }
  setTimeout(bindTheme, 500);
})();
</script>

<script>
(function(){
  if(window.__milanControlCenterV1) return;
  window.__milanControlCenterV1=true;

  function escLocal(v){
    return String(v??"").replace(/[&<>"']/g,m=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function makeUI(){
    if(document.getElementById("milanControlFab")) return;

    const fab=document.createElement("button");
    fab.id="milanControlFab";
    fab.type="button";
    fab.textContent="⚙️ Control Center";

    const overlay=document.createElement("div");
    overlay.id="milanControlOverlay";
    overlay.innerHTML=`
      <section id="milanControlPanel" role="dialog" aria-modal="true" aria-labelledby="mccTitle">
        <div id="milanControlHead">
          <h2 id="mccTitle">MILAN Control Center</h2>
          <button id="milanControlClose" type="button" aria-label="Close">✕</button>
        </div>
        <div id="milanControlBody">
          <div class="mcc-grid">

            <article class="mcc-card">
              <h3>🟢 System Health</h3>
              <div class="mcc-muted">Live application and DWN service health.</div>
              <div class="mcc-status"><span class="mcc-dot" id="mccHealthDot"></span><span id="mccHealthText">Checking…</span></div>
              <div class="mcc-actions">
                <button class="primary" id="mccHealthBtn">Refresh Health</button>
              </div>
            </article>

            <article class="mcc-card">
              <h3>🔄 Data Refresh</h3>
              <div class="mcc-muted">Refresh the current live views using the existing backend APIs.</div>
              <div class="mcc-status"><span class="mcc-dot" id="mccSyncDot"></span><span id="mccSyncText">Ready</span></div>
              <div class="mcc-actions">
                <button class="primary" id="mccSyncBtn">Sync View Now</button>
                <button id="mccRefreshBtn">Refresh Everything</button>
              </div>
            </article>

            <article class="mcc-card">
              <h3>🔐 Privacy & Access</h3>
              <div class="mcc-muted">Manage post visibility and selected-DID access.</div>
              <div class="mcc-actions">
                <button class="primary" id="mccPrivacyBtn">Open Privacy Center</button>
                <button id="mccSavedBtn">Saved Posts</button>
              </div>
            </article>

            <article class="mcc-card">
              <h3>👥 Connections</h3>
              <div class="mcc-muted">People, connection requests and relationship state.</div>
              <div class="mcc-actions">
                <button class="primary" id="mccPeopleBtn">Open People</button>
                <button id="mccRequestsBtn">View Requests</button>
              </div>
            </article>

            <article class="mcc-card wide">
              <h3>🗂️ My Data & Records</h3>
              <div class="mcc-muted">Quick access to your posts and record actions.</div>
              <div class="mcc-actions">
                <button class="primary" id="mccMineBtn">My Posts</button>
                <button id="mccAllBtn">Home Feed</button>
                <button id="mccPublicBtn">Public Feed</button>
              </div>
              <div class="mcc-list" id="mccRecords"></div>
            </article>

            <article class="mcc-card">
              <h3>📊 Account Activity</h3>
              <div class="mcc-list">
                <div class="mcc-row"><span>People</span><span id="mccPeopleCount">0</span></div>
                <div class="mcc-row"><span>Visible posts</span><span id="mccPostCount">0</span></div>
                <div class="mcc-row"><span>Requests</span><span id="mccRequestCount">0</span></div>
                <div class="mcc-row"><span>Unread alerts</span><span id="mccNotifCount">0</span></div>
              </div>
            </article>

            <article class="mcc-card">
              <h3>👤 Profile & Identity</h3>
              <div class="mcc-muted">Profile, DID and identity controls.</div>
              <div class="mcc-actions">
                <button class="primary" id="mccProfileBtn">Edit Profile</button>
                <button id="mccDidBtn">Copy DID</button>
              </div>
            </article>

          </div>
          <div id="mccResult"></div>
        </div>
      </section>
    `;

    document.body.appendChild(fab);
    document.body.appendChild(overlay);

    const close=()=>overlay.classList.remove("open");
    fab.onclick=()=>{overlay.classList.add("open");mccRefresh();};
    document.getElementById("milanControlClose").onclick=close;
    overlay.addEventListener("click",e=>{if(e.target===overlay)close();});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});

    document.getElementById("mccHealthBtn").onclick=checkHealth;
    document.getElementById("mccSyncBtn").onclick=syncView;
    document.getElementById("mccRefreshBtn").onclick=refreshEverything;

    document.getElementById("mccPrivacyBtn").onclick=()=>{
      close();
      if(typeof openPrivacyCenter==="function") openPrivacyCenter();
    };
    document.getElementById("mccSavedBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="saved"]');
      if(b)b.click();
    };
    document.getElementById("mccPeopleBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="friends"]');
      if(b)b.click();
      else if(typeof loadPeople==="function")loadPeople();
    };
    document.getElementById("mccRequestsBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="friends"]');
      if(b)b.click();
    };
    document.getElementById("mccMineBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="mine"]');
      if(b)b.click();
    };
    document.getElementById("mccAllBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="all"]');
      if(b)b.click();
    };
    document.getElementById("mccPublicBtn").onclick=()=>{
      close();
      const b=document.querySelector('[data-scope="public"]');
      if(b)b.click();
    };
    document.getElementById("mccProfileBtn").onclick=()=>{
      close();
      if(typeof openProfile==="function")openProfile();
      else document.getElementById("profileBtn")?.click();
    };
    document.getElementById("mccDidBtn").onclick=()=>{
      if(typeof copyText==="function"){
        const did=document.getElementById("myDid")?.textContent||"";
        copyText(did);
        showResult("DID copied.");
      }
    };
  }

  async function checkHealth(){
    const dot=document.getElementById("mccHealthDot");
    const text=document.getElementById("mccHealthText");
    if(!dot||!text)return;
    text.textContent="Checking…";
    dot.className="mcc-dot warn";
    try{
      const r=await fetch("/api/health",{credentials:"same-origin",cache:"no-store"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();
      const dwn=d.dwn||{};
      const good=d.ok!==false && dwn.ok!==false && dwn.storageOperational!==false;
      dot.className="mcc-dot "+(good?"":"bad");
      text.textContent=good
        ?"API + DWN healthy"
        :"Health response needs attention";
      showResult(
        "Health: "+(good?"OK":"Attention")+
        " · DWN: "+(dwn.ok===false?"problem":"ok")+
        " · Storage: "+(dwn.storageOperational===false?"problem":"ok")
      );
    }catch(e){
      dot.className="mcc-dot bad";
      text.textContent="Health check failed";
      showResult("Health check error: "+e.message);
    }
  }

  async function syncView(){
    const dot=document.getElementById("mccSyncDot");
    const text=document.getElementById("mccSyncText");
    if(!dot||!text)return;
    dot.className="mcc-dot warn";
    text.textContent="Refreshing…";
    try{
      const tasks=[];
      if(typeof loadFeed==="function")tasks.push(loadFeed());
      if(typeof loadSummary==="function")tasks.push(loadSummary());
      if(typeof loadPeople==="function")tasks.push(loadPeople());
      if(typeof loadNotifications==="function")tasks.push(loadNotifications());
      await Promise.allSettled(tasks);
      dot.className="mcc-dot";
      text.textContent="View refreshed";
      mccUpdate();
      showResult("Live feed, summary, people and notifications refreshed.");
    }catch(e){
      dot.className="mcc-dot bad";
      text.textContent="Refresh failed";
      showResult("Refresh error: "+e.message);
    }
  }

  async function refreshEverything(){
    await checkHealth();
    await syncView();
  }

  function mccUpdate(){
    const map=[
      ["peopleCount","mccPeopleCount"],
      ["postCount","mccPostCount"],
      ["requestCount","mccRequestCount"],
      ["notifCount","mccNotifCount"]
    ];
    map.forEach(([a,b])=>{
      const x=document.getElementById(a),y=document.getElementById(b);
      if(x&&y)y.textContent=x.textContent||"0";
    });

    const records=document.getElementById("mccRecords");
    if(records && Array.isArray(window.currentFeed)){
      const rows=window.currentFeed.slice(0,6);
      records.innerHTML=rows.length
        ?rows.map(r=>`
          <div class="mcc-row">
            <span>${escLocal(r.title||"Untitled record")}</span>
            <span>${escLocal(r.accessMode||"private")}</span>
          </div>
        `).join("")
        :'<div class="mcc-muted">No records loaded in the current feed.</div>';
    }
  }

  function showResult(msg){
    const box=document.getElementById("mccResult");
    if(!box)return;
    box.style.display="block";
    box.textContent=msg;
    clearTimeout(window.__mccResultTimer);
    window.__mccResultTimer=setTimeout(()=>box.style.display="none",5000);
  }

  function mccRefresh(){
    mccUpdate();
    checkHealth();
  }

  document.addEventListener("DOMContentLoaded",makeUI,{once:true});
  setTimeout(makeUI,1500);
  setInterval(()=>{if(document.getElementById("milanControlOverlay")?.classList.contains("open"))mccUpdate()},2000);
})();
</script>
