        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@500;600&display=swap');
        * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .display { font-family: 'Geist', 'Inter', sans-serif; }

        .aurora { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.55; will-change: transform; }
        .blob-1 { width: 760px; height: 760px; background: radial-gradient(circle at 30% 30%, #7C3AED, transparent 60%); top: -180px; left: -160px; animation: drift1 28s ease-in-out infinite alternate; }
        .blob-2 { width: 680px; height: 680px; background: radial-gradient(circle at 50% 50%, #3B82F6, transparent 60%); top: 10%; left: 35%; animation: drift2 32s ease-in-out infinite alternate; opacity: 0.42; }
        .blob-3 { width: 720px; height: 720px; background: radial-gradient(circle at 70% 70%, #EC4899, transparent 60%); bottom: -200px; right: -180px; animation: drift3 30s ease-in-out infinite alternate; opacity: 0.38; }
        @keyframes drift1 { 0% { transform: translate3d(0,0,0) scale(1); } 100% { transform: translate3d(120px,80px,0) scale(1.08); } }
        @keyframes drift2 { 0% { transform: translate3d(0,0,0) scale(1); } 100% { transform: translate3d(-80px,120px,0) scale(1.12); } }
        @keyframes drift3 { 0% { transform: translate3d(0,0,0) scale(1); } 100% { transform: translate3d(-60px,-90px,0) scale(1.06); } }

        .grain { position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0.035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); mix-blend-mode: soft-light; }

        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.08); }
        .glass-strong { background: rgba(255,255,255,0.06); backdrop-filter: blur(28px) saturate(200%); -webkit-backdrop-filter: blur(28px) saturate(200%); border: 1px solid rgba(255,255,255,0.10); }
        .glass-subtle { background: rgba(255,255,255,0.03); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.06); }

        .topbar-wrap { position: sticky; top: 0; z-index: 40; padding: 12px 16px 0 16px; }
        @media(min-width: 768px){ .topbar-wrap { padding: 14px 20px 0 20px; } }
        .topbar { height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 10px 0 14px; }

        .layout { display: grid; grid-template-columns: 320px 1fr 360px; gap: 20px; padding: 20px; height: calc(100vh - 84px); align-items: start; position: relative; z-index: 5; }
        @media(max-width: 1280px){ .layout { grid-template-columns: 300px 1fr; } .rightbar { display: none !important; } }
        @media(max-width: 1024px){ .layout { grid-template-columns: 1fr; padding: 14px; height: calc(100vh - 84px - 88px); } .sidebar { display: none !important; } }
        @media(max-width: 768px){ .topbar-wrap { padding: 10px 10px 0 10px; } .topbar { height: 56px; border-radius: 18px; } .layout { gap: 14px; padding: 12px; } }

        .col-scroll { overflow-y: auto; overflow-x: hidden; max-height: 100%; overscroll-behavior: contain; }
        .col-scroll::-webkit-scrollbar { width: 0px; height: 0px; }
        .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        .feed-scroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(124,58,237,0.5) transparent; }
        .feed-scroll::-webkit-scrollbar { width: 4px; }
        .feed-scroll::-webkit-scrollbar-track { background: transparent; }
        .feed-scroll::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(124,58,237,0.7), rgba(59,130,246,0.5)); border-radius: 999px; }

        .nav-btn { transition: all 0.22s cubic-bezier(0.16,1,0.3,1); }
        .nav-btn:hover { transform: translateX(2px); background: rgba(255,255,255,0.05); }
        .nav-btn.active { background: linear-gradient(135deg, rgba(124,58,237,0.9), rgba(59,130,246,0.9)); box-shadow: 0 8px 24px rgba(124,58,237,0.25), inset 0 1px 0 rgba(255,255,255,0.2); border-color: transparent !important; color: white; }
        .nav-btn:active { transform: scale(0.97); }

        .card-hover { transition: all 0.35s cubic-bezier(0.16,1,0.3,1); }
        .card-hover:hover { transform: translateY(-1px); border-color: rgba(124,58,237,0.22) !important; box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(124,58,237,0.12) inset; }

        .icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; transition: all 0.2s ease; }
        .icon-btn:hover { background: rgba(255,255,255,0.08); transform: translateY(-1px); }
        .icon-btn:active { transform: scale(0.97); }

        .publish-btn { background: linear-gradient(135deg, #7C3AED 0%, #3B82F6 100%); box-shadow: 0 8px 24px rgba(124,58,237,0.35), inset 0 1px 0 rgba(255,255,255,0.2); transition: all 0.25s cubic-bezier(0.16,1,0.3,1); }
        .publish-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(124,58,237,0.45), inset 0 1px 0 rgba(255,255,255,0.25); }
        .publish-btn:active { transform: scale(0.97); }
        .publish-btn .arrow { transition: transform 0.25s cubic-bezier(0.16,1,0.3,1); }
        .publish-btn:hover .arrow { transform: translateX(3px); }

        .search-glow { transition: all 0.25s ease; }
        .search-glow:focus-within { box-shadow: 0 0 0 1px rgba(124,58,237,0.4), 0 0 24px rgba(124,58,237,0.18), inset 0 1px 0 rgba(255,255,255,0.06); border-color: rgba(124,58,237,0.35) !important; }

        .avatar-ring { background: conic-gradient(from 180deg at 50% 50%, #7C3AED, #3B82F6, #EC4899, #7C3AED); padding: 2px; border-radius: 999px; }
