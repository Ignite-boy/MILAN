<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Milan Chat</title>
  <link rel="stylesheet" href="/milan-core.css">
  <link rel="stylesheet" href="/milan-ui.css">
  <link rel="stylesheet" href="/premium.css">
  <style>
    :root{--line:rgba(255,255,255,.09);--text:#f7f8ff;--muted:#94a3c7;--orange:#ff9c38;--pink:#df46c8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,rgba(94,92,255,.16),transparent 28%),radial-gradient(circle at 90% 8%,rgba(223,70,200,.12),transparent 26%),linear-gradient(180deg,#071126 0%,#0a1430 45%,#090f22 100%)}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(760px,100%);padding:52px 34px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(18,34,72,.92),rgba(8,19,45,.94));box-shadow:0 24px 70px rgba(0,0,0,.28);text-align:center}
    .logo{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--orange),var(--pink));box-shadow:0 14px 32px rgba(223,70,200,.2)}
    h1{margin:0;font-size:clamp(32px,5vw,50px);letter-spacing:-.035em}
    .subtitle{margin:14px auto 28px;max-width:600px;color:var(--muted);font-size:16px;line-height:1.7}
    .status{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:#dbe4ff;font-size:13px;font-weight:700;background:rgba(255,255,255,.04)}
    .dot{width:8px;height:8px;border-radius:50%;background:#42dfb5;box-shadow:0 0 12px rgba(66,223,181,.7)}
    a{display:inline-block;margin-top:28px;padding:13px 22px;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--pink));color:#101323;text-decoration:none;font-weight:800}
  </style>
<link rel="canonical" href="https://milanlife.in/chat">
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="logo">💬</div>
      <div class="status"><span class="dot"></span> Milan Chat is live</div>
      <h1>Welcome to Milan Chat</h1>
      <p class="subtitle">Private one-to-one communication is coming here. This is the dedicated Milan space for direct conversations between people.</p>
      <a href="/app.html">Back to Milan</a>
    </section>
  </main>
</body>
</html>
