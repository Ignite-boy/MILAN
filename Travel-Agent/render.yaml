services:
  - type: web
    name: ai-travel-agent
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_EMBED_MODEL
        value: models/gemini-embedding-001
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ENABLE_AUTO_PREFERENCE_EXTRACTION
        value: "true"
