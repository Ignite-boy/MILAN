name: MILAN SEO Inventory

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public site URL to audit"
        required: false
        default: "https://milanlife.in/"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  seo:
    name: Deep SEO inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Audit production site
        env:
          SEO_TARGET_URL: ${{ inputs.target_url || 'https://milanlife.in/' }}
          SEO_MAX_PAGES: "150"
          SEO_TIMEOUT: "20"
        run: |
          python -m py_compile seo_inventory.py
          python seo_inventory.py

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milan-seo-inventory
          path: seo-report.json
          retention-days: 14
