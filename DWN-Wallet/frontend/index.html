<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natively Wallet</title></head><body><h1>Natively DWN Wallet</h1><p>DID: <span id="did">Not created</span></p><p>Balance: <span id="balance">0</span> MDC</p><button id="create">Create Account</button><script>document.getElementById("create").onclick=()=>{const did="did:natively:"+crypto.randomUUID();localStorage.setItem("nativelyDid",did);document.getElementById("did").textContent=did};const did=localStorage.getItem("nativelyDid");if(did)document.getElementById("did").textContent=did;</script></body></html>
